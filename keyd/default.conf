[ids]
*
# Don't remap virtual keyboards (snippets would otherwise pick up Hyper).
-1234:5678

[main]
# Physical Caps Lock is Control (better Ctrl placement on Apple keyboards).
capslock = layer(control)

# Physical Left Control is Hyper:
#   tap  -> nothing
#   hold -> Super+Ctrl+Alt+Shift for the next key
leftcontrol = overload(hyper, noop)

# Hyper is the 4-modifier chord. Keys pass through with those modifiers held.
# Bind Hyper chords in Hyprland as: SUPER + CTRL + ALT + SHIFT + <key>
[hyper:C-M-A-S]
