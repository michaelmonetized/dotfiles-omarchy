# fcitx5 blocks Hyprland xkb remaps (e.g. ctrl:nocaps) from reaching apps like tmux.
# Install keyd for caps->ctrl with fcitx5 enabled: omarchy pkg add keyd
exec-once = uwsm-app -- bash -lc 'sleep 2 && pkill -x fcitx5 || true'
exec-once = vicinae server

# Extra autostart processes
# exec-once = uwsm-app -- my-service

# Prevent sleep, hibernate, and lid-switch sleep to allow indefinite screensaver
exec-once = systemd-inhibit --what=sleep:idle:handle-lid-switch --why="Indefinite screensaver" --mode=block sleep infinity
